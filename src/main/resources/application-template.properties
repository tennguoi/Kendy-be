# ======================================================
# 1. APPLICATION
# ======================================================
spring.application.name=KendyDigital
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# Local/dev: disable Whitelabel Error Page for easier API error reading
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=on_param

# ======================================================
# 2. DOCKER COMPOSE (disable on dev machine)
# ======================================================
spring.docker.compose.enabled=false

# ======================================================
# 3. DATABASE (PostgreSQL)
# ======================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Database Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# ======================================================
# 4. BANK CONFIGURATION (bank transfer)
# ======================================================
app.bank.name=${BANK_NAME}
app.bank.account-number=${BANK_ACCOUNT_NUMBER}
app.bank.account-owner=${BANK_ACCOUNT_OWNER}
app.bank.deposit-expiry-minutes=${DEPOSIT_EXPIRY_MINUTES:30}
app.bank.transfer-prefix=${DEPOSIT_TRANSFER_PREFIX:KD}

# ======================================================
# 5. SEPAY WEBHOOK
# ======================================================
app.sepay.webhook.require-api-key=${SEPAY_WEBHOOK_REQUIRE_API_KEY:true}
app.sepay.webhook.api-key=${SEPAY_WEBHOOK_API_KEY}
app.sepay.webhook.api-key-header=${SEPAY_WEBHOOK_API_KEY_HEADER:X-SePay-Api-Key}
app.sepay.webhook.require-hmac=${SEPAY_WEBHOOK_REQUIRE_HMAC:true}
app.sepay.webhook.hmac-secret=${SEPAY_WEBHOOK_HMAC_SECRET}
app.sepay.webhook.signature-header=${SEPAY_WEBHOOK_SIGNATURE_HEADER:X-SePay-Signature}
app.sepay.webhook.rejection-alert-threshold=${SEPAY_WEBHOOK_REJECTION_ALERT_THRESHOLD:5}
app.sepay.webhook.rejection-window-seconds=${SEPAY_WEBHOOK_REJECTION_WINDOW_SECONDS:300}

# Access-control safety defaults
app.security.max-active-sessions=${MAX_ACTIVE_SESSIONS:3}
app.entitlement.lifecycle-interval-ms=${ENTITLEMENT_LIFECYCLE_INTERVAL_MS:60000}
app.rate-limit.renewal-per-minute=${RENEWAL_RATE_LIMIT_PER_MINUTE:3}

# ======================================================
# 6. BALANCE INTEGRITY CHECK
# ======================================================
app.finance.integrity-check-cron=${BALANCE_INTEGRITY_CHECK_CRON:0 15 * * * *}

# ======================================================
# 6.1. INVENTORY ALERTS
# ======================================================
app.inventory.alert-enabled=${INVENTORY_ALERT_ENABLED:true}
app.inventory.alert-cron=${INVENTORY_ALERT_CRON:0 0 8 * * *}
app.inventory.low-stock-threshold=${INVENTORY_LOW_STOCK_THRESHOLD:2}
app.inventory.expiring-days=${INVENTORY_EXPIRING_DAYS:7}

# ======================================================
# 6.1.1. MANUAL ORDER DEADLINE REMINDER
# ======================================================
app.manual-order.deadline-check-interval-ms=${MANUAL_ORDER_DEADLINE_CHECK_INTERVAL_MS:60000}

# ======================================================
# 6.2. CREDENTIAL ENCRYPTION
# ======================================================
# Production profile requires CREDENTIAL_ENCRYPTION_KEY or APP_CREDENTIAL_ENCRYPTION_KEY.

# ======================================================
# 7. SECURITY & CORS
# ======================================================
app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
app.security.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1,::1}
app.security.trust-cloudflare=${TRUST_CLOUDFLARE:false}
app.security.ip-allowlist=${SECURITY_IP_ALLOWLIST:}
app.security.enable-http-only-cookie=${ENABLE_HTTP_ONLY_COOKIE:false}
app.security.swagger-enabled=${SWAGGER_ENABLED:false}

# ======================================================
# 7.0. SECURITY MONITORING
# ======================================================
app.security.monitor.enabled=${SECURITY_MONITOR_ENABLED:true}
app.security.monitor.dry-run=${SECURITY_MONITOR_DRY_RUN:true}
app.security.monitor.block-enabled=${SECURITY_MONITOR_BLOCK_ENABLED:true}
app.security.monitor.max-ban-hours=${SECURITY_MONITOR_MAX_BAN_HOURS:24}
app.security.monitor.telegram-enabled=${SECURITY_TELEGRAM_ENABLED:false}
app.security.monitor.telegram-bot-token=${SECURITY_TELEGRAM_BOT_TOKEN:}
app.security.monitor.telegram-chat-id=${SECURITY_TELEGRAM_CHAT_ID:}
app.security.monitor.email-alerts-enabled=${SECURITY_EMAIL_ALERTS_ENABLED:true}
app.security.monitor.alert-recipient=${SECURITY_ALERT_RECIPIENT:}
app.security.monitor.turnstile-enabled=${SECURITY_TURNSTILE_ENABLED:false}
app.security.monitor.turnstile-secret=${SECURITY_TURNSTILE_SECRET:}
app.security.monitor.auto-ban-allowlist=${SECURITY_AUTO_BAN_ALLOWLIST:}
app.security.monitor.geo-ip-enabled=${SECURITY_GEOIP_ENABLED:false}
app.security.monitor.geolite-database-path=${SECURITY_GEOLITE_DB_PATH:}
app.security.monitor.geolite-asn-database-path=${SECURITY_GEOLITE_ASN_DB_PATH:}

# ======================================================
# 7.1. UPLOAD (file attachments for tickets, warranty, etc.)
# ======================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# ======================================================
# 7.2. CLOUDINARY (service images)
# ======================================================
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.service-image-folder=${CLOUDINARY_SERVICE_IMAGE_FOLDER:kendy-digital/services}

# ======================================================
# 8. OAUTH2
# ======================================================
app.oauth2.success-redirect-url=${OAUTH2_SUCCESS_REDIRECT_URL}
app.oauth2.failure-redirect-url=${OAUTH2_FAILURE_REDIRECT_URL}
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.oauth2.github.client-id=${GITHUB_CLIENT_ID}
app.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET}

# ======================================================
# 9. EMAIL (optimized - remove username/password when auth=false)
# ======================================================
# Real email for sending (authentication)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Display email for recipients
app.email.enabled=true
app.email.from=${EMAIL_FROM}

# Frontend base URL for links in emails
app.email.frontend-base-url=${FRONTEND_BASE_URL}

# ======================================================
# 10. RATE LIMIT
# ======================================================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
app.rate-limit.webhook-per-minute=${RATE_LIMIT_WEBHOOK_PER_MINUTE:120}
app.rate-limit.finance-per-minute=${RATE_LIMIT_FINANCE_PER_MINUTE:60}
app.rate-limit.deposit-per-minute=${RATE_LIMIT_DEPOSIT_PER_MINUTE:5}

# ======================================================
# 11. REDIS (connection to Redis on WSL/localhost)
# ======================================================
app.redis.enabled=${APP_REDIS_ENABLED:true}
app.redis.host=${REDIS_HOST:localhost}
app.redis.port=${REDIS_PORT:6379}
app.redis.password=${REDIS_PASSWORD:}
app.redis.database=${REDIS_DATABASE:0}
app.redis.timeout-ms=${REDIS_TIMEOUT_MS:2000}

# Session uses Redis (keep disabled by default)
app.redis.session-enabled=${APP_REDIS_SESSION_ENABLED:false}
app.redis.session-timeout-seconds=${APP_REDIS_SESSION_TIMEOUT_SECONDS:1800}
spring.session.store-type=none
server.servlet.session.persistent=false

# Swagger/OpenAPI only documents controller APIs. Data REST/HATEOAS auto configs are excluded
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocHateoasConfiguration,org.springdoc.core.configuration.SpringDocDataRestConfiguration
spring.data.rest.detection-strategy=annotated

# ======================================================
# 12. OBSERVABILITY
# ======================================================
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,prometheus}
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=${PROMETHEUS_METRICS_ENABLED:true}
management.metrics.tags.application=kendy-backend

# ======================================================
# 13. SECURITY HEADERS
# ======================================================
app.security.headers.content-type-options=${SECURITY_HEADER_X_CONTENT_TYPE_OPTIONS:true}
app.security.headers.referrer-policy=${SECURITY_HEADER_REFERRER_POLICY:strict-origin-when-cross-origin}
app.security.headers.permissions-policy=${SECURITY_HEADER_PERMISSIONS_POLICY:geolocation=(), microphone=(), camera=()}