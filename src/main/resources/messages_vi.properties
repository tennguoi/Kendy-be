# ============================================================
# VIETNAMESE ERROR MESSAGES
# ============================================================

# ---- Common ----
error.unexpected = Lỗi hệ thống không mong muốn. Vui lòng thử lại sau.
error.internal = Lỗi máy chủ nội bộ. Vui lòng thử lại sau.
error.notFound = Không tìm thấy tài nguyên yêu cầu.
error.forbidden = Bạn không có quyền thực hiện hành động này.
error.unauthorized = Vui lòng đăng nhập để tiếp tục.
error.badRequest = Yêu cầu không hợp lệ.
error.conflict = Dữ liệu xung đột.
error.tooManyRequests = Quá nhiều yêu cầu. Vui lòng thử lại sau.
error.maintenance = Hệ thống đang bảo trì. Vui lòng quay lại sau.
error.validation = Dữ liệu nhập vào không hợp lệ. Vui lòng kiểm tra lại.

# ---- Auth ----
auth.error.emailOrPassword = Email hoặc mật khẩu không đúng.
auth.error.emailExists = Email này đã được đăng ký.
auth.error.invalidCredentials = Thông tin đăng nhập không hợp lệ.
auth.error.accountLocked = Tài khoản đã bị khóa. Vui lòng liên hệ hỗ trợ.
auth.error.accountDisabled = Tài khoản đã bị vô hiệu hóa.
auth.error.tokenExpired = Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.
auth.error.tokenInvalid = Token không hợp lệ.
auth.error.tokenRevoked = Token đã bị thu hồi.
auth.error.registrationFailed = Không thể tạo tài khoản. Vui lòng thử lại.
auth.error.passwordTooWeak = Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường và số.
auth.error.passwordMismatch = Mật khẩu xác nhận không khớp.
auth.error.oldPasswordIncorrect = Mật khẩu hiện tại không đúng.
auth.error.oauthProviderNotSupported = Nhà cung cấp OAuth không được hỗ trợ.
auth.error.oauthStateInvalid = Trạng thái OAuth không hợp lệ. Vui lòng thử lại.
auth.error.twoFactorRequired = Cần xác thực 2FA để tiếp tục.
auth.error.twoFactorInvalid = Mã xác thực 2FA không hợp lệ hoặc đã hết hạn.
auth.error.twoFactorExpired = Mã xác thực 2FA đã hết hạn. Vui lòng yêu cầu mã mới.
auth.error.resetTokenInvalid = Mã đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
auth.error.verifyTokenInvalid = Mã xác thực email không hợp lệ hoặc đã hết hạn.
auth.error.emailNotVerified = Email chưa được xác thực. Vui lòng kiểm tra email.
auth.error.sessionExpired = Phiên làm việc đã hết hạn.

# ---- Deposit ----
deposit.error.notFound = Không tìm thấy yêu cầu nạp tiền.
deposit.error.notPending = Yêu cầu nạp tiền không ở trạng thái chờ xử lý.
deposit.error.alreadyCompleted = Yêu cầu nạp tiền đã hoàn tất.
deposit.error.cannotCancel = Không thể hủy yêu cầu nạp tiền ở trạng thái hiện tại.
deposit.error.amountTooSmall = Số tiền nạp phải lớn hơn {0}đ.
deposit.error.amountTooLarge = Số tiền nạp vượt quá giới hạn cho phép.
deposit.error.expired = Yêu cầu nạp tiền đã hết hạn.
deposit.error.invalidCode = Mã nạp tiền không hợp lệ.
deposit.error.duplicate = Yêu cầu nạp tiền trùng lặp.

# ---- Order ----
order.error.notFound = Không tìm thấy đơn hàng.
order.error.cannotCancel = Không thể hủy đơn hàng ở trạng thái hiện tại.
order.error.alreadyProcessed = Đơn hàng đã được xử lý.
order.error.invalidStatus = Trạng thái đơn hàng không hợp lệ.
order.error.serviceUnavailable = Dịch vụ hiện không khả dụng.
order.error.insufficientBalance = Số dư ví không đủ để mua dịch vụ này. Vui lòng nạp thêm tiền.
order.error.serviceRequiresConsultation = Dịch vụ này cần tư vấn trước khi mua. Vui lòng tạo ticket hỗ trợ.
order.error.priceNotValid = Dịch vụ chưa có giá hợp lệ để tạo đơn.
order.error.duplicate = Đơn hàng trùng lặp. Mã idempotency đã được sử dụng.
order.error.serviceIdInvalid = Dịch vụ chưa có mã hợp lệ để tạo đơn.

# ---- Wallet ----
wallet.error.insufficient = Số dư ví không đủ.
wallet.error.notFound = Không tìm thấy ví.
wallet.error.transactionNotFound = Không tìm thấy giao dịch.
wallet.error.invalidAmount = Số tiền giao dịch không hợp lệ.
wallet.error.negativeAmount = Số tiền không thể là số âm.

# ---- Ticket ----
ticket.error.notFound = Không tìm thấy ticket hỗ trợ.
ticket.error.closed = Ticket đã đóng. Không thể gửi phản hồi.
ticket.error.cannotClose = Không thể đóng ticket ở trạng thái hiện tại.
ticket.error.cannotReopen = Không thể mở lại ticket đã đóng.
ticket.error.messageEmpty = Nội dung tin nhắn không được để trống.
ticket.error.attachmentTooLarge = File đính kèm vượt quá kích thước cho phép (tối đa 5MB).
ticket.error.attachmentTypeNotAllowed = Định dạng file không được hỗ trợ.

# ---- Coupon ----
coupon.error.invalid = Mã giảm giá không hợp lệ.
coupon.error.expired = Mã giảm giá đã hết hạn.
coupon.error.usageLimit = Mã giảm giá đã hết lượt sử dụng.
coupon.error.notApplicable = Mã giảm giá không áp dụng được cho dịch vụ này.
coupon.error.minAmountNotMet = Chưa đạt số tiền tối thiểu để áp dụng mã giảm giá.
coupon.error.alreadyUsed = Bạn đã sử dụng mã giảm giá này.

# ---- Service ----
service.error.notFound = Không tìm thấy dịch vụ.
service.error.outOfStock = Dịch vụ hiện đang hết hàng.
service.error.inactive = Dịch vụ hiện không hoạt động.
service.error.invalidInput = Dữ liệu đầu vào cho dịch vụ không hợp lệ.
service.error.ctaNotAllowed = Hành động này không được phép cho loại dịch vụ này.

# ---- Inventory ----
inventory.error.accountNotFound = Không tìm thấy tài khoản trong kho.
inventory.error.accountAlreadyAssigned = Tài khoản đã được cấp cho người dùng khác.
inventory.error.accountExpired = Tài khoản đã hết hạn.
inventory.error.batchNotFound = Không tìm thấy lô nhập hàng.
inventory.error.invalidCredentialFormat = Định dạng thông tin tài khoản không hợp lệ.

# ---- File ----
file.error.tooLarge = File vượt quá kích thước cho phép (tối đa 10MB).
file.error.typeNotAllowed = Định dạng file không được hỗ trợ.
file.error.uploadFailed = Không thể upload file. Vui lòng thử lại.
file.error.notFound = Không tìm thấy file.
file.error.deleteFailed = Không thể xóa file.
file.error.virusDetected = File bị từ chối do phát hiện mã độc.

# ---- Data integrity ----
data.error.uniqueConstraint = Dữ liệu đã tồn tại trong hệ thống.
data.error.foreignKeyConstraint = Dữ liệu liên quan không tồn tại.
data.error.invalidData = Lỗi dữ liệu không hợp lệ.

# ---- Webhook ----
webhook.error.invalidPayload = Dữ liệu webhook không hợp lệ.
webhook.error.invalidSignature = Chữ ký webhook không hợp lệ.
webhook.error.transactionNotFound = Không tìm thấy giao dịch ngân hàng tương ứng.

# ---- Admin ----
admin.error.notFound = Không tìm thấy quản trị viên.
admin.error.cannotModifySelf = Không thể tự thay đổi quyền của chính mình.
admin.error.roleNotFound = Không tìm thấy vai trò.
admin.error.permissionDenied = Bạn không có quyền thực hiện hành động này.

# ---- Warranty ----
warranty.error.notFound = Không tìm thấy yêu cầu bảo hành.
warranty.error.outOfRange = Yêu cầu bảo hành ngoài phạm vi bảo hành.
warranty.error.orderNotEligible = Đơn hàng không đủ điều kiện bảo hành.
warranty.error.duplicate = Đã có yêu cầu bảo hành cho đơn hàng này.

# ---- Rate limit ----
ratelimit.error.auth = Quá nhiều yêu cầu đăng nhập. Vui lòng thử lại sau {0} phút.
ratelimit.error.deposit = Quá nhiều yêu cầu nạp tiền. Vui lòng thử lại sau.
ratelimit.error.api = Quá nhiều yêu cầu API. Vui lòng thử lại sau.

# ============================================================
# NOTIFICATIONS (User notifications — titles and bodies)
# ============================================================

# ---- Order notifications ----
notification.order.credential_delivered.title = Tài khoản đã được giao
notification.order.credential_delivered.body = Đơn {0} đã hoàn thành. Vào Tài khoản của tôi để xem thông tin đăng nhập.
notification.order.manual_created.title = Đơn thủ công đã được tiếp nhận
notification.order.manual_created.body = Đơn {0} đã được tạo. Ticket {1} dùng để trao đổi yêu cầu xử lý.
notification.order.cancelled.title = Đơn hàng đã hủy
notification.order.cancelled.body = Đơn {0} đã bị hủy và được hoàn tiền.
notification.order.completed.title = Đơn hàng hoàn tất
notification.order.completed.body = Đơn {0} đã hoàn tất.
notification.order.failed.title = Đơn hàng thất bại
notification.order.failed.body = Đơn {0} không thể hoàn tất.
notification.order.refunded.title = Đơn hàng đã hoàn tiền
notification.order.refunded.body = Đơn {0} đã được hoàn tiền.

# ---- Entitlement notifications ----
notification.entitlement.updated.title = Cập nhật quyền truy cập
notification.entitlement.updated.body = {0} đã chuyển sang {1}
notification.entitlement.expiring.title = Dịch vụ sắp hết hạn
notification.entitlement.expiring.body = {0} sẽ hết hạn vào {1}
notification.entitlement.expired.title = Dịch vụ đã hết hạn
notification.entitlement.expired.body = {0} đã bị tạm ngưng. Gia hạn để tiếp tục sử dụng.

# ---- Checkout notifications ----
notification.checkout.wallet_credited.title = Tiền đã vào ví, đơn chưa tạo
notification.checkout.wallet_credited.body = Thanh toán đã được cộng vào ví, nhưng đơn {0} chưa được tạo tự động. Lý do: {1}. Bạn có thể đặt lại bằng số dư ví hoặc liên hệ admin hỗ trợ.

# ---- Warranty notifications ----
notification.warranty.updated.title = Cập nhật bảo hành đơn {0}
notification.warranty.updated.body = Yêu cầu bảo hành đã chuyển sang trạng thái {0}

# ============================================================
# ADMIN NOTIFICATIONS (titles and bodies)
# ============================================================

admin.notification.order.manual_new.title = Đơn thủ công mới {0}
admin.notification.order.manual_new.body = User #{0} đặt {1}. Cần xử lý ngoài thực tế rồi cập nhật trạng thái đơn.
admin.notification.order.deadline_overdue.title = Đơn thủ công quá hạn {0}
admin.notification.order.deadline_soon.title = Đơn thủ công sắp tới hạn {0}
admin.notification.order.deadline.body = Dịch vụ {0} của user #{1} có hạn xử lý {2}.
admin.notification.inventory.alert.title = Cảnh báo kho tài khoản
admin.notification.inventory.alert.body = Low stock: {0}, sắp hết hạn trong {1} ngày: {2}, reservation quá hạn đã nhả: {3}. Vào Admin > Dịch vụ để kiểm tra kho.
admin.notification.checkout.wallet_credited.title = Checkout đã cộng ví nhưng chưa tạo đơn
admin.notification.checkout.wallet_credited.body = Checkout {0} của user #{1} đã thanh toán cho {2} nhưng order chưa tạo. Lý do: {3}
admin.notification.warranty.new.title = Yêu cầu bảo hành mới {0}
admin.notification.warranty.new.body = User #{0} gửi bảo hành cho {1}
admin.notification.entitlement.expired.title = Cần thu hồi quyền truy cập
admin.notification.entitlement.expired.body = Entitlement #{0} - {1} đã hết hạn. Strategy: {2}

# ============================================================
# EMAIL FALLBACKS (used when no DB template exists)
# ============================================================

email.password_reset.fallback = Sử dụng mã {0} để đặt lại mật khẩu. Có hiệu lực đến {1}.
email.email_verification.fallback = Xác thực email của bạn bằng cách truy cập: {0}. Liên kết hết hạn lúc: {1}.
email.two_factor.fallback = Mã xác thực của bạn là: {0}. Mã này hết hạn lúc: {1}.
email.deposit.fallback = Yêu cầu nạp {0} ({1} VND) đã {2}. Có hiệu lực đến: {3}.
email.wallet.fallback = Ví của bạn đã được {0} {1} VND. Lý do: {2}. Admin: {3}.
email.account.fallback = Tài khoản của bạn đã được {0}: {1}. Lý do: {2}.
