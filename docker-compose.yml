version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kendy_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env or shell}
      POSTGRES_DB: kendy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kendy_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: kendy_backend
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/kendy?preferQueryMode=simple
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env or shell}
      - REDIS_HOST=redis
      - APP_REDIS_ENABLED=true
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set in .env or shell}

  frontend:
    build: ../fe
    container_name: kendy_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080

volumes:
  postgres_data:
