spring.application.name=KendyDigital
# Disable Spring Boot Docker Compose lifecycle to avoid requiring Docker on developer machines
spring.docker.compose.enabled=false
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kendy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.bank.name=${BANK_NAME:ACB}
app.bank.account-number=${BANK_ACCOUNT_NUMBER:0000000000}
app.bank.account-owner=${BANK_ACCOUNT_OWNER:KENDY DIGITAL}
app.bank.deposit-expiry-minutes=${DEPOSIT_EXPIRY_MINUTES:30}
app.bank.transfer-prefix=${DEPOSIT_TRANSFER_PREFIX:KD}

app.sepay.webhook.require-api-key=${SEPAY_WEBHOOK_REQUIRE_API_KEY:true}
app.sepay.webhook.api-key=${SEPAY_WEBHOOK_API_KEY:}
app.sepay.webhook.api-key-header=${SEPAY_WEBHOOK_API_KEY_HEADER:X-SePay-Api-Key}
app.sepay.webhook.require-hmac=${SEPAY_WEBHOOK_REQUIRE_HMAC:true}
app.sepay.webhook.hmac-secret=${SEPAY_WEBHOOK_HMAC_SECRET:}
app.sepay.webhook.signature-header=${SEPAY_WEBHOOK_SIGNATURE_HEADER:X-SePay-Signature}

app.bootstrap.seed-services=${APP_BOOTSTRAP_SEED_SERVICES:true}
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${APP_BOOTSTRAP_ADMIN_NAME:Kendy Admin}

app.finance.integrity-check-cron=${BALANCE_INTEGRITY_CHECK_CRON:0 15 * * * *}

app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

app.oauth2.success-redirect-url=${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5173/oauth/callback}
app.oauth2.failure-redirect-url=${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:5173/login}
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}

app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:no-reply@kendydigital.local}
app.email.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
app.rate-limit.webhook-per-minute=${RATE_LIMIT_WEBHOOK_PER_MINUTE:120}
app.rate-limit.finance-per-minute=${RATE_LIMIT_FINANCE_PER_MINUTE:60}

# Redis toggle and connection settings (toggle with app.redis.enabled)
app.redis.enabled=${APP_REDIS_ENABLED:true}
app.redis.host=${REDIS_HOST:localhost}
app.redis.port=${REDIS_PORT:6379}
app.redis.password=${REDIS_PASSWORD:}
app.redis.database=${REDIS_DATABASE:0}
app.redis.timeout-ms=${REDIS_TIMEOUT_MS:2000}

# Use Redis for HTTP session when session-enabled=true
app.redis.session-enabled=${APP_REDIS_SESSION_ENABLED:false}
app.redis.session-timeout-seconds=${APP_REDIS_SESSION_TIMEOUT_SECONDS:1800}

# If Redis-backed HTTP session is enabled, this ties servlet session timeout to the same value.
server.servlet.session.timeout=${app.redis.session-timeout-seconds}s
